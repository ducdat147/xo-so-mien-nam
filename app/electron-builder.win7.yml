# Bản Windows 7 (SPEC §9): Electron 22.3.27 là bản cuối còn chạy Win7/8/8.1.
# Một bộ cài gộp 32-bit + 64-bit, tự chọn theo máy. Phải build mã bằng XSMN_TARGET=win7 trước.
extends: ./electron-builder.yml
electronVersion: 22.3.27
artifactName: xo-so-dai-ly-win7-${version}.${ext}
win:
  target:
    - target: nsis
      arch: [ia32, x64]
  icon: build/icon.png
  executableName: xo-so-dai-ly
  signAndEditExecutable: true
